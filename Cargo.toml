[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
ron = "0.12"
toml = { version = "1.2", features = ["preserve_order"] }
tracing = "0.1"
notify = "9.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
proc-macro-crate = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "deflate", "zstd"] }
schemars = "1"
jsonschema = { version = "0.63", default-features = false }
tokio = { version = "1", features = ["rt", "sync"] }


[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
authors = ["weilanzhuan@gmail.com"]
license = "Apache-2.0"
repository = "https://github.com/hushink/playact"
