[package]
name = "playact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A type-safe, extensible behavior tree engine for game automation"
keywords = ["behavior-tree", "game-ai", "automation", "bt"]
categories = ["game-development", "algorithms"]
readme = "README.md"

[features]
default = ["std"]
std = []
trace-record = ["std"]
test-util = ["std", "trace-record"]
inspector = ["std"]
diff-serde = ["std", "dep:serde", "dep:serde_json"]
config = ["std", "dep:serde", "dep:serde_json", "dep:serde_path_to_error"]
blackboard-serde = ["std", "dep:serde", "dep:serde_json"]
snapshot-serde = ["std", "dep:serde", "dep:serde_json"]
toml = ["config", "dep:toml"]
yaml = ["config", "dep:serde_yaml_ng"]
ron = ["config", "dep:ron"]
schema = ["config", "dep:schemars"]
tracing = ["std", "dep:tracing"]
hot-reload = ["config", "dep:notify"]
remote-config = ["config", "dep:reqwest"]
tokio = ["std", "dep:tokio"]
macros = ["dep:playact-macros"]
full = [
    "std",
    "trace-record",
    "test-util",
    "inspector",
    "diff-serde",
    "config",
    "blackboard-serde",
    "snapshot-serde",
    "toml",
    "yaml",
    "ron",
    "schema",
    "tracing",
    "hot-reload",
    "remote-config",
    "tokio",
    "macros",
]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_path_to_error = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
serde_yaml_ng = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
playact-macros = { version = "0.1.2", path = "../playact-macros", optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "battle_ai"

[[example]]
name = "battle_ai_config"
required-features = ["config"]

[[example]]
name = "live_inspector"
required-features = ["inspector"]

[[example]]
name = "reload_audit"
required-features = ["hot-reload", "inspector", "diff-serde"]

[[example]]
name = "battle_ai_showcase"
required-features = ["hot-reload"]

[[bench]]
name = "engine"
harness = false
