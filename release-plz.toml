# release-plz configuration.
#
# `release-pr` prepares version bumps and changelogs in a pull request.
# `release` publishes versions already present in Cargo.toml when they are not
# yet on crates.io. The initial publish is handled by the CI workflow so a
# local `cargo publish` is never required. See .github/workflows/release.yml.

[workspace]
allow_dirty = false
changelog_update = true
dependencies_update = false
git_release_enable = true
git_tag_enable = true
pr_branch_prefix = "release-plz-"
pr_labels = ["area: ci"]
publish_timeout = "30m"
release = true
# Release  when you merge the release PR only
release_always = false
# Only real changes trigger a version bump. In particular, release-plz's own
# "chore: release ..." commit must not start another release PR.
release_commits = '^(feat|fix|perf|refactor|docs?|deps|build|revert|security|changed|deprecated)(\([^)]*\))?!?:'
semver_check = true

[changelog]
commit_parsers = [
  { message = '^(chore|ci|test|style)(\([^)]*\))?:', skip = true },
  { message = '^feat', group = 'added' },
  { message = '^changed', group = 'changed' },
  { message = '^deprecated', group = 'deprecated' },
  { message = '^fix', group = 'fixed' },
  { message = '^security', group = 'security' },
  { message = '^.*', group = 'other' },
]

[[package]]
name = "playact"

# cargo-semver-checks does not support proc-macro crates.
[[package]]
name = "playact-macros"
semver_check = false
