# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# Dependabot alerts and security updates must also be enabled in repository settings.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
      rust-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
