name: Release-plz

# Both the initial crates.io publish and normal releases run in CI.
#
# Initial publish:
#   1. Add the CARGO_REGISTRY_TOKEN repository secret.
#   2. Set the FIRST_RELEASE repository variable to "true".
#   3. Run this workflow manually or push to main.
#   4. After both crates are on crates.io, set FIRST_RELEASE to "false".
#
# Normal releases:
#   Merge the release PR opened by the release-pr job. The next push publishes
#   the versions committed by that PR.
#
# The release jobs use CARGO_REGISTRY_TOKEN because crates.io trusted
# publishing cannot bootstrap a crate that does not exist yet. After the first
# publish, trusted publishing can be configured on crates.io and used by
# removing the token environment variable and granting id-token: write.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check release state
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.state.outputs.has_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect existing release tags
        id: state
        shell: bash
        run: |
          if [ -n "$(git tag --list 'playact-v*')" ] && [ -n "$(git tag --list 'playact-macros-v*')" ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Initial release pending"
              echo
              echo "No complete release tag set was found. Set the FIRST_RELEASE repository variable to true, run this workflow, then set it back to false."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release-first:
    name: Publish initial release
    runs-on: ubuntu-latest
    # The owner guard prevents fork pushes from receiving release secrets.
    if: github.repository_owner == 'hushink' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.FIRST_RELEASE == 'true'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      - name: Run release-plz release
        id: release_plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: "0.4.3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Remind to leave first-release mode
        if: steps.release_plz.outputs.releases_created == 'true'
        shell: bash
        run: |
          {
            echo "### Initial release published"
            echo
            echo "Set the FIRST_RELEASE repository variable to false so release PRs resume."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: preflight
    if: github.repository_owner == 'hushink' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.FIRST_RELEASE != 'true' && needs.preflight.outputs.has_release == 'true'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      - name: Run release-plz release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: "0.4.3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    needs: preflight
    if: github.repository_owner == 'hushink' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.FIRST_RELEASE != 'true' && needs.preflight.outputs.has_release == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write # apply release-plz.toml pr_labels
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      # The default GITHUB_TOKEN cannot trigger CI checks on the release PR.
      # Add a PAT or GitHub App token if checks must run there.
      - name: Run release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: "0.4.3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
