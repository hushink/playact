name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.92"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test examples
        run: cargo test --workspace --all-features --examples

      - name: no_std core
        if: matrix.toolchain == 'stable'
        run: cargo check -p playact --no-default-features --target thumbv7em-none-eabihf --lib

      - name: Feature combinations
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          for features in config,schema diff-serde snapshot-serde trace-serde inspector inspector,diff-serde hot-reload remote-config; do
            echo "::group::features=$features"
            cargo check -p playact --no-default-features --features "$features" --lib
            echo "::endgroup::"
          done

      - name: Docs
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Example battle_ai
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo run -p playact --example battle_ai --quiet > /dev/null

      - name: Example battle_ai_config
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo run -p playact --example battle_ai_config --features config --quiet > /dev/null

      - name: Example battle_ai_showcase
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo run -p playact --example battle_ai_showcase --features hot-reload --quiet > /dev/null

      - name: Example reload_audit
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo run -p playact --example reload_audit --features hot-reload,inspector,diff-serde --quiet > /dev/null

      - name: Example save_game
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo run -p playact --example save_game --features blackboard-serde,snapshot-serde --quiet > /dev/null

      - name: Example schema_export
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          cargo run -p playact --example schema_export --features config,schema --quiet > /dev/null
          grep -q '"patrol"' target/playact-schema.json
          grep -q '"waypoints"' target/playact-schema.json
          grep -q '"Morale written to the blackboard."' target/playact-schema.json
          grep -Fq '`waypoints` (integer, required)' target/playact-catalog.md

      - name: Example config_lint
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          cargo run -p playact --example config_lint --features config,schema,toml,yaml,ron --quiet -- crates/playact/examples/battle_ai.json
          cargo run -p playact --example config_lint --features config,schema,toml,yaml,ron --quiet -- --json crates/playact/examples/battle_ai.json > target/config-lint.json
          grep -q '"valid": true' target/config-lint.json

      - name: CLI smoke
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          cargo run -p playact-cli --quiet -- schema > target/cli-schema.json
          grep -q '"sequence"' target/cli-schema.json
          cargo run -p playact-cli --quiet -- catalog --schema target/playact-schema.json > target/cli-catalog.md
          grep -Fq '`action.name`' target/cli-catalog.md
          grep -Fq '`patrol`' target/cli-catalog.md
          cargo run -p playact-cli --quiet -- lint crates/playact/examples/battle_ai.json
          cargo run -p playact-cli --quiet -- convert crates/playact/examples/battle_ai.json target/cli-battle.toml
          cargo run -p playact-cli --quiet -- lint target/cli-battle.toml
          bundle_parent=$(mktemp -d)
          bundle_dir="$bundle_parent/bundle"
          cargo run -p playact-cli --quiet -- bundle crates/playact/examples/battle_ai.json "$bundle_dir"
          cargo run -p playact-cli --quiet -- lint "$bundle_dir/battle_ai.json"
          rm -rf "$bundle_parent"
          cargo run -p playact-cli --quiet -- graph crates/playact/examples/battle_ai.json > target/cli-graph.mmd
          grep -q 'flowchart LR' target/cli-graph.mmd
          grep -q 'action: wait' target/cli-graph.mmd
          fmt_dir=$(mktemp -d)
          fmt_copy="$fmt_dir/battle_ai.json"
          cp crates/playact/examples/battle_ai.json "$fmt_copy"
          cargo run -p playact-cli --quiet -- fmt "$fmt_copy"
          cargo run -p playact-cli --quiet -- fmt --check "$fmt_copy"
          mkdir -p "$fmt_dir/shared"
          printf '%s\n' '{"version":1,"root":{"type":"include","path":"shared/child.json"}}' > "$fmt_copy"
          printf '%s\n' '{"version":1,"root":{"type":"action","name":"anything"}}' > "$fmt_dir/shared/child.json"
          cargo run -p playact-cli --quiet -- fmt --recursive "$fmt_copy"
          cargo run -p playact-cli --quiet -- fmt --check --recursive "$fmt_copy"
          rm -rf "$fmt_dir"
          cargo run -p playact-cli --quiet -- diff crates/playact/examples/battle_ai.json crates/playact/examples/battle_ai.json
